{% load static %}
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Translation workflow</title><link rel="stylesheet" href="{% static 'css/app-shell.css' %}"><link rel="stylesheet" href="{% static 'css/feature-workspace.css' %}"><link rel="stylesheet" href="{% static 'css/editorial-theme.css' %}?v=20261021-site-polish-1"></head>
<body class="dashboard-shell"><header class="workspace-topbar"><a class="workspace-topbar__brand" href="{% if request.user.role == 'Admin' %}{% url 'admin-dashboard' %}{% elif request.user.role == 'Editor' %}{% url 'editor-dashboard' %}{% else %}{% url 'journalist-dashboard' %}{% endif %}"><span class="workspace-topbar__mark">✦</span><span>Article Studio<small>Translation workflow</small></span></a><nav class="workspace-topbar__actions" aria-label="Workspace navigation"><a href="{% url 'workspace-search-page' %}">Search</a><a class="is-active" href="{% url 'translation-workspace-page' %}">Translations</a><a href="{% url 'notification-center-page' %}">Notifications</a></nav></header>
<main class="feature-page" data-user-role="{{ request.user.role }}"><header class="feature-page__heading"><div><span class="feature-eyebrow">Global publishing</span><h1>Translation workflow</h1><p>Create localized stories with language-specific review and publishing status.</p></div></header><form id="translation-form" class="workspace-search-form"><label>Article ID<input name="article_id" type="number" min="1" required placeholder="e.g. 33"></label><label>Language<select name="language_code"><option value="hi">Hindi</option><option value="gu">Gujarati</option><option value="mr">Marathi</option><option value="es">Spanish</option><option value="fr">French</option><option value="de">German</option><option value="ar">Arabic</option></select></label><label>Title<input name="title" maxlength="35" required></label><label>Subtitle<input name="subtitle" maxlength="50"></label><label>Summary<input name="summary" maxlength="500"></label><label class="workspace-search-form__wide">Content<textarea name="content" rows="6" required></textarea></label><button class="button" type="submit">Save translation</button></form><p id="translation-status" class="feature-status" role="status" aria-live="polite">Enter an article ID to load translations.</p><section id="translation-list" class="translation-list" aria-live="polite"></section></main><script src="{% static 'js/translation-workspace.js' %}" defer></script><script src="{% static 'js/notification-badge.js' %}" defer></script></body></html>
