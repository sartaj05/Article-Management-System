{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signed out | Article Studio</title>
    <link rel="icon" href="{% static 'favicon.ico' %}" type="image/x-icon">
    <link rel="stylesheet" href="{% static 'css/app-shell.css' %}">
    <link rel="stylesheet" href="{% static 'css/auth.css' %}?v=20261005-header-1">
    <link rel="stylesheet" href="{% static 'css/app-dialogs.css' %}">
    <link rel="stylesheet" href="{% static 'css/editorial-theme.css' %}?v=20261013-desk-2">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="auth-shell">
    {% include 'partials/site_header.html' %}
    <main class="auth-main"><section class="auth-card logout-state" aria-labelledby="logout-title">{% csrf_token %}<span class="eyebrow">Account access</span><h1 id="logout-title">Sign out of Article Studio</h1><p>End your browser session and return to the newsroom.</p><button class="button" type="button" data-dashboard-logout>Log out</button><div class="auth-links"><a href="{% url 'home' %}">Go to discover</a></div></section></main>
    {% include 'partials/site_footer.html' %}
    <script src="{% static 'js/workspace-ui.js' %}?v=20261014-1" defer></script>
    <script src="{% static 'js/home.js' %}?v=20261013-desk-2" defer></script>
    <script src="{% static 'js/app-dialogs.js' %}?v=20261014-1" defer></script>
</body>
</html>
