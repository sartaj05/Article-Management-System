{% extends 'users/base.html' %}{% load static %}{% block title %}Newsletter campaigns | Article Studio{% endblock %}{% block content %}<section class="account-page container"><header class="account-page__header"><div><span class="eyebrow">Audience distribution</span><h1>Newsletter campaigns</h1><p>Create a draft newsletter, review the audience size, and send it when ready.</p></div></header><section class="account-panel"><form id="newsletter-form" class="newsletter-form"><label>Frequency<select name="frequency"><option value="daily">Daily</option><option value="weekly" selected>Weekly</option></select></label><label>Subject<input name="subject" maxlength="200" required placeholder="This week in the newsroom"></label><label>Body<textarea name="body" rows="8" required placeholder="Write the newsletter content…"></textarea></label><button class="button" type="submit">Save draft</button></form><p id="newsletter-status" class="account-status" role="status" aria-live="polite"></p></section><section class="account-panel"><h2>Recent campaigns</h2><div id="newsletter-editions" class="newsletter-edition-list"></div></section></section><script src="{% static 'js/newsletter-campaigns.js' %}" defer></script>{% endblock %}
