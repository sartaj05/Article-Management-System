{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A modern article publishing and editorial management platform.">
    <meta name="theme-color" content="#292553">
    <link rel="manifest" href="{% static 'manifest.webmanifest' %}">
    <title>{% block title %}Article Management System{% endblock %}</title>
    <link rel="icon" href="{% static 'favicon.ico' %}" type="image/x-icon">
    <link rel="stylesheet" href="{% static 'css/app-shell.css' %}">
    <link rel="stylesheet" href="{% static 'css/accessibility.css' %}">
    <link rel="stylesheet" href="{% static 'css/support-chat.css' %}">
    <link rel="stylesheet" href="{% static 'css/app-dialogs.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="site-shell">
    <a class="skip-link" href="#main-content">Skip to content</a>
    {% include 'partials/site_header.html' %}
    <main id="main-content" class="site-main">{% block content %}{% endblock %}</main>
    {% include 'support/chat_widget.html' %}
    {% include 'partials/site_footer.html' %}
    <script src="{% static 'js/home.js' %}" defer></script>
    <script src="{% static 'js/accessibility.js' %}" defer></script>
    <script src="{% static 'js/pwa.js' %}" defer></script>
    <script src="{% static 'js/support-chat.js' %}" defer></script>
    <script src="{% static 'js/app-dialogs.js' %}" defer></script>
</body>
</html>
