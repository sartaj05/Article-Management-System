name: Integration and visual checks

on:
  pull_request:
    branches: [main, sartaj]
  workflow_dispatch:

jobs:
  postgres-redis:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: article_management
          POSTGRES_USER: article_management
          POSTGRES_PASSWORD: integration-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U article_management -d article_management"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install worker and PostgreSQL dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-workers.txt psycopg2-binary==2.9.10
      - name: Run PostgreSQL integration suite
        env:
          DJANGO_DEBUG: "false"
          DJANGO_SECRET_KEY: integration-secret-key-0123456789-abcdefghijklmnopqrstuvwxyz
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
          DATABASE_ENGINE: postgresql
          POSTGRES_DB: article_management
          POSTGRES_USER: article_management
          POSTGRES_PASSWORD: integration-password
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: "5432"
          REDIS_URL: redis://127.0.0.1:6379/0
          CACHE_BACKEND: redis
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py test --noinput

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install application dependencies
        run: pip install -r requirements.txt
      - name: Install browser dependencies
        run: npm ci && npx playwright install --with-deps chromium
      - name: Run deployment smoke and functional browser checks
        run: npm run test:e2e -- tests/e2e/deployment-smoke.spec.js tests/e2e/new-features.spec.js --project=chromium
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-integration-artifacts
          path: test-results/
          if-no-files-found: ignore
