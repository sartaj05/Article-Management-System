name: Django CI

on:
  push:
    branches: [main, sartaj]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-workers.txt
          pip install pip-audit
      - name: Check Django configuration
        run: python manage.py check
      - name: Check production configuration
        env:
          DJANGO_DEBUG: "false"
          DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
          SECURE_SSL_REDIRECT: "true"
          SESSION_COOKIE_SECURE: "true"
          CSRF_COOKIE_SECURE: "true"
          SECURE_HSTS_SECONDS: "3600"
        run: python manage.py check --deploy
      - name: Check migrations are committed
        run: python manage.py makemigrations --check --dry-run
      - name: Check Python syntax
        run: python -m compileall -q articles users config
      - name: Check whitespace
        run: git diff --check
      - name: Verify dependency metadata
        run: python -m pip check
      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt --progress-spinner off
      - name: Run tests
        run: python manage.py test
      - name: Verify static collection
        run: python manage.py collectstatic --noinput --clear

  container:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: article-studio:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  browser:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Install browser test dependencies
        run: npm ci && npx playwright install --with-deps chromium
      - name: Run responsive browser suite
        run: npm run test:e2e -- --project=chromium --project=tablet --project=mobile --project=narrow-mobile
