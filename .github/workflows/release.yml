name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the image to GitHub Container Registry
        required: true
        default: false
        type: boolean
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-workers.txt
      - name: Validate Django deployment configuration
        env:
          DJANGO_DEBUG: "false"
          DJANGO_SECRET_KEY: release-validation-secret-only-0123456789-abcdefghijklmnopqrstuvwxyz
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
          DATABASE_ENGINE: postgresql
          POSTGRES_DB: release_validation
          POSTGRES_USER: release_validation
          POSTGRES_PASSWORD: release_validation_password
          POSTGRES_HOST: localhost
          SECURE_SSL_REDIRECT: "true"
          SESSION_COOKIE_SECURE: "true"
          CSRF_COOKIE_SECURE: "true"
          SECURE_HSTS_SECONDS: "31536000"
          CSRF_TRUSTED_ORIGINS: https://localhost
          METRICS_TOKEN: release-metrics-token
          ENFORCE_PRODUCTION_SECURITY: "true"
        run: |
          python manage.py check --deploy
          python manage.py check_security
          python manage.py makemigrations --check --dry-run
          python manage.py test --noinput

  publish:
    needs: validate
    if: github.event_name == 'push' || inputs.publish == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke-test:
    needs: publish
    if: needs.publish.result == 'success' && vars.DEPLOYMENT_BASE_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run deployment smoke test
        env:
          BASE_URL: ${{ vars.DEPLOYMENT_BASE_URL }}
        run: python scripts/smoke_test.py

  deploy:
    name: Deploy production image
    needs: [publish, smoke-test]
    # DEPLOYMENT_BASE_URL is optional for first-time or private deployments;
    # the smoke-test job is skipped in that case, but the deploy must continue.
    # The in-container smoke test below remains mandatory after the rollout.
    if: always() && needs.publish.result == 'success' && github.event_name == 'push' && vars.DEPLOYMENT_HOST != '' && (needs.smoke-test.result == 'success' || needs.smoke-test.result == 'skipped')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy with health-gated rollback
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.DEPLOYMENT_HOST }}
          username: ${{ vars.DEPLOYMENT_USER }}
          key: ${{ secrets.DEPLOYMENT_SSH_KEY }}
          script_stop: true
          script: |
            set -eu
            cd "${{ vars.DEPLOYMENT_PATH }}"
            export APP_IMAGE="ghcr.io/${{ github.repository }}:${{ github.sha }}"
            web_container="$(docker compose -f docker-compose.production.yml ps -q web 2>/dev/null || true)"
            previous_image="$(docker inspect --format='{{.Config.Image}}' "$web_container" 2>/dev/null || true)"
            printf '%s\n' "$previous_image" > .article-studio-previous-image
            docker login ghcr.io -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"
            docker compose -f docker-compose.production.yml pull web worker beat
            docker compose -f docker-compose.production.yml up -d --no-build --remove-orphans
            if ! docker compose -f docker-compose.production.yml exec -T -e BASE_URL=http://127.0.0.1:8000 web python scripts/smoke_test.py; then
              if [ -s .article-studio-previous-image ]; then
                export APP_IMAGE="$(cat .article-studio-previous-image)"
                docker compose -f docker-compose.production.yml up -d --no-build --remove-orphans
              fi
              exit 1
            fi
