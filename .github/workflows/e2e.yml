name: Browser and mobile checks

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install application dependencies
        run: pip install -r requirements.txt
      - name: Prepare database and demo user
        run: |
          python manage.py migrate
          python manage.py shell -c "from users.models import CustomUser; CustomUser.objects.get_or_create(username='e2e_journalist', defaults={'email':'e2e@example.com','role':'Journalist'}); u=CustomUser.objects.get(username='e2e_journalist'); u.set_password('StrongPass123!'); u.save()"
      - name: Install browser test dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start application
        run: python manage.py runserver 127.0.0.1:8000 > server.log 2>&1 &
      - name: Run browser and mobile checks
        run: npm run test:e2e
