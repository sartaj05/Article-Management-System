{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Article Studio{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/app-shell.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="site-shell">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
        <div class="container site-header__inner">
            <a class="brand" href="/"><span class="brand-mark"><i class="fa-solid fa-feather-pointed" aria-hidden="true"></i></span><span class="brand-copy">Article Studio<small>Editorial workspace</small></span></a>
            <button class="nav-toggle" type="button" aria-controls="site-nav" aria-expanded="false" aria-label="Open navigation"><i class="fa-solid fa-bars" aria-hidden="true"></i></button>
            <nav id="site-nav" class="site-nav" aria-label="Main navigation"><a href="/"><i class="fa-solid fa-compass" aria-hidden="true"></i> Discover</a><a href="/#articles"><i class="fa-regular fa-newspaper" aria-hidden="true"></i> Articles</a><a href="/login-template/">Log in</a><a class="nav-cta" href="/register-template/">Start writing</a></nav>
        </div>
    </header>
    <main id="main-content" class="site-main"><div class="container">{% block content %}{% endblock %}</div></main>
    <footer class="site-footer"><div class="container site-footer__inner"><span>&copy; 2026 Article Studio.</span><span>Write clearly. Review thoughtfully. Publish confidently.</span></div></footer>
    <script src="{% static 'js/home.js' %}" defer></script>
</body>
</html>
